plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.combatebullying.album'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.projetodevida.album'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            // Chave do app (fica no repositório para que toda versão nova instale por cima da anterior).
            storeFile file('../combate-bullying.keystore')
            storePassword 'combate2026'
            keyAlias 'combatebullying'
            keyPassword 'combate2026'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            debuggable false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
